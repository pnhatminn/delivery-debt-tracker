    return `<tr><td class="num">${i + 1}</td><td><b>${esc(c.name)}</b><br><span style="font-size:12px">${esc(c.phone || '')}</span></td><td>${esc((areaOf(c.areaId) || {}).code || '')}</td><td class="num">${grp(x.old)}</td><td class="num">${grp(x.goods)}</td><td class="num"><b>${grp(x.total)}</b> <span style="font-size:12px">(${grp(x.old)})</span></td><td class="num">${s.visited ? grp(x.ret) : ''}</td><td class="num">${s.visited ? grp(x.pay) : ''}</td><td class="num">${s.visited ? grp(x.remain) : ''}</td><td>${esc(s.goodsNote)}</td></tr>`;
  }).join('');
  return printBar('trip/' + t.id) + `<div class="paper"><div class="center" style="font-weight:600">${esc(S.settings.shopName)}</div><h2>SỔ CHỐT HÀNG ĐI</h2><div class="center">Chuyến ${esc(t.code)} · Ngày ${fmtDate(t.date)}${t.note ? ' · ' + esc(t.note) : ''}</div>
    <table><thead><tr><th>#</th><th>Khách hàng</th><th>Tuyến</th><th class="num">Nợ cũ</th><th class="num">Hàng chuyến này</th><th class="num">Tổng nợ (nợ cũ)</th><th class="num">Trả hàng</th><th class="num">Thanh toán</th><th class="num">Nợ lại</th><th>Ghi chú hàng</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><th></th><th colspan="2">Tổng cộng</th><th class="num">${grp(tOld)}</th><th class="num">${grp(tGoods)}</th><th class="num">${grp(tTotal)}</th><th></th><th class="num">${tPay ? grp(tPay) : ''}</th><th class="num">${tRemain ? grp(tRemain) : ''}</th><th></th></tr></tfoot></table>
    <div class="meta"><span>Đơn vị: đồng</span><span>In lúc ${new Date().toLocaleString('vi-VN')}</span></div>
    <div class="sign"><div><b>Người giao hàng</b><br><i style="font-size:12px">(ký, ghi rõ họ tên)</i></div><div><b>Chủ đại lý</b><br><i style="font-size:12px">(ký, ghi rõ họ tên)</i></div></div></div>`;
}
function vPrintCust(id) {
  const c = custOf(id); if (!c) return notFound('khách hàng');
  let run = 0; const ents = entriesOf(c.id);
  const rows = ents.map(e => { run += e.amount; const t = e.tripId ? tripOf(e.tripId) : null; return `<tr><td>${fmtDate(e.date)}</td><td>${t ? esc(t.code) : ''}</td><td>${esc(entryLabel(e))}${e.note ? ' – ' + esc(e.note) : ''}</td><td class="num">${e.amount > 0 ? grp(e.amount) : ''}</td><td class="num">${e.amount < 0 ? grp(e.amount) : ''}</td><td class="num"><b>${run < 0 ? '−' : ''}${grp(run)}</b></td></tr>`; }).join('');
  return printBar('cust/' + c.id) + `<div class="paper"><div class="center" style="font-weight:600">${esc(S.settings.shopName)}</div><h2>BẢN ĐỐI CHIẾU CÔNG NỢ</h2><div class="center">Đến ngày ${fmtDate(todayISO())}</div>
    <div class="meta"><div>Khách hàng: <b>${esc(c.name)}</b>${c.owner ? ' – ' + esc(c.owner) : ''}<br>Địa chỉ: ${esc(c.address) || '…………………………'}<br>Điện thoại: ${esc(c.phone) || '…………………'}</div><div>Tuyến: ${esc((areaOf(c.areaId) || {}).name || '')}</div></div>
    <table><thead><tr><th>Ngày</th><th>Chuyến</th><th>Nội dung</th><th class="num">Tăng nợ</th><th class="num">Giảm nợ</th><th class="num">Số dư</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="blank">Chưa có phát sinh</td></tr>'}</tbody>
    <tfoot><tr><th colspan="5" style="text-align:right">Số dư nợ đến ngày ${fmtDate(todayISO())}</th><th class="num">${run < 0 ? '−' : ''}${grp(run)}</th></tr></tfoot></table>
    <div class="meta"><span>Đơn vị: đồng</span></div>
    <div class="sign"><div><b>Xác nhận của khách hàng</b><br><i style="font-size:12px">(ký, ghi rõ họ tên)</i></div><div><b>Đại lý</b><br><i style="font-size:12px">(ký, ghi rõ họ tên)</i></div></div></div>`;
}

/* ===== Màn hình đăng nhập / đăng ký / quên mật khẩu ===== */
ICONS.logout = '<path d="M9 4H5v16h4"/><path d="M14 8l4 4-4 4M18 12H9"/>';
ICONS.eye = '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>';
ICONS.lock = '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>';
UI.authRoute = 'login';

function authBrand() {
  const feats = [
    ['book', 'Sổ chốt hàng đi', 'Chọn tiệm, nhập tiền hàng. Nợ cũ tự lấy từ sổ, tiệm vượt hạn mức báo đỏ.'],
    ['cash', 'Phiếu thu tại tiệm', 'Trừ hàng nguyên mác, ghi hàng quay đầu, ra ngay số nợ lại.'],
    ['ret', 'Hàng quay đầu', 'Theo dõi từ lúc nhận đến khi hãng xử lý xong và giao lại cho khách.'],
  ];
  return `<section class="auth-brand">
    <div class="ab-top"><div class="ab-mark" aria-hidden="true">HT</div><div><div class="ab-name">${esc(S ? S.settings.shopName : SHOP)}</div><div class="ab-sub">Phân phối sỉ phụ tùng xe máy</div></div></div>
    <div class="ab-hero"><h2>Ghi nợ, thu tiền và chốt chuyến ngay trên điện thoại</h2><p>Thay cho sổ giấy: nợ cũ tự cộng, hàng trả tự trừ, cuối chuyến biết ngay tiền đã thu và nợ còn lại của từng tiệm.</p></div>
    <ul class="ab-feats">${feats.map(([ic, t, d]) => `<li>${icon(ic)}<div><b>${t}</b><span>${d}</span></div></li>`).join('')}</ul>
    <div class="ab-foot">Bản mẫu · tài khoản và dữ liệu lưu trên trình duyệt của máy này</div>
  </section>`;
}
const pwField = (id, label, extra = '', side = '') => `<div class="field"><div class="lbl-row"><label for="${id}">${label}</label>${side}</div><div class="pw-wrap"><input class="inp" id="${id}" type="password" ${extra}><button type="button" class="icon-btn" data-act="togglePw" data-for="${id}" aria-label="Hiện mật khẩu">${icon('eye')}</button></div></div>`;

function vLogin() {
  return `<div class="auth-card">
    <div><h1>Đăng nhập</h1><p class="sub" style="margin:6px 0 0;font-size:14.5px">Đăng nhập để mở sổ công nợ.</p></div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="lgIdent">Email hoặc số điện thoại</label><input class="inp" id="lgIdent" name="ident" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="VD: ten@gmail.com hoặc 0908 123 456"></div>
      ${pwField('lgPw', 'Mật khẩu', 'name="pw" autocomplete="current-password"', '<button type="button" class="link-btn" data-act="authGo" data-to="forgot">Quên mật khẩu?</button>')}
      <label class="check" style="align-items:center"><input type="checkbox" id="lgRemember" checked> Ghi nhớ đăng nhập trong 30 ngày</label>
      <div class="auth-err" id="lgErr" role="alert"></div>
      <button type="submit" class="btn primary lg block">Đăng nhập ${icon('chev')}</button>
    </form>
    <div class="auth-alt">Chưa có tài khoản? <button type="button" class="link-btn" data-act="authGo" data-to="register">Đăng ký tài khoản</button></div>
    <div class="demo-hint"><span>Tài khoản demo: <b>${esc(DEMO.ident)}</b></span><button type="button" class="btn sm" data-act="fillDemo">Điền tài khoản demo</button></div>
  </div>`;
}
function vRegister() {
  return `<div class="auth-card">
    <div><h1>Đăng ký tài khoản</h1><p class="sub" style="margin:6px 0 0;font-size:14.5px">Tài khoản dùng chung sổ công nợ của đại lý trên máy này.</p></div>
    <form id="regForm" novalidate>
      <div class="field"><label for="rgName">Họ và tên</label><input class="inp" id="rgName" name="name" autocomplete="name" placeholder="VD: Nguyễn Văn Hùng"></div>
      <div class="field"><label for="rgIdent">Email hoặc số điện thoại</label><input class="inp" id="rgIdent" name="ident" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="Dùng để đăng nhập"></div>
      <div class="form-grid">${pwField('rgPw', 'Mật khẩu', `name="pw" autocomplete="new-password" placeholder="Tối thiểu ${PW_MIN} ký tự"`)}${pwField('rgPw2', 'Nhập lại mật khẩu', 'name="pw2" autocomplete="new-password"')}</div>
      <div class="auth-err" id="rgErr" role="alert"></div>
      <button type="submit" class="btn primary lg block">Tạo tài khoản ${icon('chev')}</button>
    </form>
    <div class="auth-alt">Đã có tài khoản? <button type="button" class="link-btn" data-act="authGo" data-to="login">Đăng nhập</button></div>
  </div>`;
}
function vForgot() {
  return `<div class="auth-card">
    <div><h1>Quên mật khẩu</h1></div>
    <div class="banner">${icon('info')}<div class="txt">Bản mẫu chưa gửi được mã xác thực qua SMS hoặc email, vì chưa có máy chủ. Khi làm web thật, bạn nhập số điện thoại hoặc email để nhận mã và đặt lại mật khẩu.</div></div>
    <p style="margin:0;color:var(--ink-2)">Trong lúc dùng thử, hãy đăng nhập bằng tài khoản demo hoặc đăng ký một tài khoản mới.</p>
    <button type="button" class="btn primary lg block" data-act="authGo" data-to="login">${icon('back')}Quay lại đăng nhập</button>
    <button type="button" class="btn lg block" data-act="authGo" data-to="register">Đăng ký tài khoản mới</button>
  </div>`;
}

function renderAuth() {
  $('#shell').hidden = true;
  const a = $('#auth'); a.hidden = false;
  const v = { login: vLogin, register: vRegister, forgot: vForgot }[UI.authRoute] || vLogin;
  a.innerHTML = `<div class="auth">${authBrand()}<section class="auth-main">${v()}</section></div>`;
  document.title = { login: 'Đăng nhập', register: 'Đăng ký', forgot: 'Quên mật khẩu' }[UI.authRoute] + ' · ' + SHOP;
  const lf = $('#loginForm');
  if (lf) lf.addEventListener('submit', e => {
    e.preventDefault();
    const ident = $('#lgIdent').value, pw = $('#lgPw').value, err = $('#lgErr');
    if (!ident.trim() || !pw) { err.textContent = 'Nhập email hoặc số điện thoại và mật khẩu.'; return; }
    const u = checkLogin(ident, pw);
    if (!u) { err.textContent = 'Email, số điện thoại hoặc mật khẩu không đúng.'; $('#lgPw').value = ''; $('#lgPw').focus(); return; }
    startSession(u, $('#lgRemember').checked);
    enterApp(`Xin chào, ${u.name}`);
  });
  const rf = $('#regForm');
  if (rf) rf.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#rgName').value.trim(), ident = normIdent($('#rgIdent').value), pw = $('#rgPw').value, pw2 = $('#rgPw2').value, err = $('#rgErr');
    const fail = (msg, id) => { err.textContent = msg; if (id) $('#' + id).focus(); };
    if (!name) return fail('Nhập họ và tên.', 'rgName');
    if (!identKind(ident)) return fail('Nhập email đúng dạng (ten@gmail.com) hoặc số điện thoại 10 số bắt đầu bằng 0.', 'rgIdent');
    if (ACC.users.some(u => u.ident === ident)) return fail('Email hoặc số điện thoại này đã có tài khoản. Bấm Đăng nhập để vào.', 'rgIdent');
    if (pw.length < PW_MIN) return fail(`Mật khẩu cần tối thiểu ${PW_MIN} ký tự.`, 'rgPw');
    if (pw !== pw2) return fail('Hai lần nhập mật khẩu chưa khớp.', 'rgPw2');
    const u = makeUser(name, ident, pw); ACC.users.push(u); saveAccounts();
    startSession(u, true);
    enterApp('Đã tạo tài khoản. Xin chào, ' + u.name);
  });
  $$('#auth form').forEach(f => f.addEventListener('input', () => $$('.auth-err', f).forEach(x => { x.textContent = ''; })));
  const first = $('#auth input:not([type=checkbox])');
  if (first && window.matchMedia('(min-width: 900px)').matches) first.focus();
  window.scrollTo(0, 0);
}
function enterApp(msg) {
  UI.authRoute = 'login';
  $('#auth').innerHTML = '';
  document.title = SHOP;
  render(); window.scrollTo(0, 0);
  toast(msg);
}
ACT.authGo = el => { UI.authRoute = el.dataset.to; renderAuth(); };
ACT.fillDemo = () => { $('#lgIdent').value = DEMO.ident; $('#lgPw').value = DEMO.password; $('#lgErr').textContent = ''; };
ACT.togglePw = el => {
  const i = document.getElementById(el.dataset.for); if (!i) return;
  const show = i.type === 'password'; i.type = show ? 'text' : 'password';
  el.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'); el.classList.toggle('on', show);
};
ACT.logout = async () => {
  const ok = await confirmBox('Đăng xuất?', 'Dữ liệu sổ vẫn giữ nguyên trên máy này. Lần sau cần đăng nhập lại để mở sổ.', 'Đăng xuất');
  if (!ok) return;
  endSession(); UI.draft = null; UI.authRoute = 'login'; render(); toast('Đã đăng xuất');
};
function userBlock() {
  const u = currentUser(); if (!u) return '';
  return `<div class="me"><span class="avatar" aria-hidden="true">${esc(initials(u.name))}</span><div class="grow"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.ident)}</div></div><button class="icon-btn" data-act="logout" title="Đăng xuất" aria-label="Đăng xuất">${icon('logout')}</button></div>`;
}

/* ---------- khởi động ---------- */
function boot() {
  loadAccounts();
  loadSession();
  S = load();
  if (!S) { S = sampleState(); save(); }
  if (!HOSTED && location.hash.length > 1) UI.route = decodeURIComponent(location.hash.slice(1));
  if (!HOSTED) { try { history.replaceState({ r: UI.route }, '', '#' + UI.route); } catch (e) { /* bỏ qua */ } }
  render();
}
boot();

})();
</script>
</body>
</html>
