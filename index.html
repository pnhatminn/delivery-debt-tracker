<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phụ tùng Hữu Thuỳ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — left rail ≥ 900px, bottom tab bar on phones; content column max 1160px. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F7F9FB;
  --line: #DDE3EA;
  --line-strong: #C3CCD8;
  --ink: #0F1B2D;
  --ink-2: #435064;
  --ink-3: #697587;
  --btn-bg: #0F2942;
  --btn-ink: #FFFFFF;
  --btn-hover: #1C3B5E;
  --accent: #2449A8;
  --accent-soft: #E8EEFB;
  --debt: #B42318;
  --debt-soft: #FDEDEB;
  --paid: #137A3B;
  --paid-soft: #E5F4EA;
  --wait: #A8460A;
  --wait-soft: #FDF0E2;
  --meter: #E6EAF0;
  --panel: #0F2942;
  --panel-2: #1A3A5C;
  --panel-ink: #EEF3F9;
  --panel-sub: #AFC0D4;
  --scrim: rgba(15, 27, 45, .45);
  --shadow: 0 1px 2px rgba(15, 27, 45, .05), 0 2px 8px rgba(15, 27, 45, .04);
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
  --r-sm: 7px;
  --side: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131B; --surface: #151D28; --surface-2: #1A2330; --line: #263242; --line-strong: #3A4859;
    --ink: #E6EBF2; --ink-2: #B3BECC; --ink-3: #8592A3;
    --btn-bg: #9DBBF0; --btn-ink: #0A1626; --btn-hover: #B6CDF5;
    --accent: #9DBBF0; --accent-soft: #1D2B44;
    --debt: #F4867C; --debt-soft: #3A1E1D; --paid: #5BCB8A; --paid-soft: #16301F; --wait: #F2A962; --wait-soft: #3A2817;
    --meter: #263242; --scrim: rgba(0, 0, 0, .6);
    --panel: #0B1C2E; --panel-2: #132A42;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131B; --surface: #151D28; --surface-2: #1A2330; --line: #263242; --line-strong: #3A4859;
  --ink: #E6EBF2; --ink-2: #B3BECC; --ink-3: #8592A3;
  --btn-bg: #9DBBF0; --btn-ink: #0A1626; --btn-hover: #B6CDF5;
  --accent: #9DBBF0; --accent-soft: #1D2B44;
  --debt: #F4867C; --debt-soft: #3A1E1D; --paid: #5BCB8A; --paid-soft: #16301F; --wait: #F2A962; --wait-soft: #3A2817;
  --meter: #263242; --scrim: rgba(0, 0, 0, .6);
    --panel: #0B1C2E; --panel-2: #132A42;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }
.muted { color: var(--ink-3); }
.sub { color: var(--ink-3); font-size: 13px; }
.debt { color: var(--debt); }
.paid { color: var(--paid); }
.wait { color: var(--wait); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px max(12px, env(safe-area-inset-left, 0px)); z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px; background: var(--btn-bg); color: var(--btn-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; letter-spacing: .02em;
}
.brand-name { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.brand-sub { font-size: 12.5px; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); color: var(--ink-2);
  text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--wait-soft); color: var(--wait); border-radius: 99px; padding: 1px 8px; }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }

.main { margin-left: var(--side); min-width: 0; }
.view {
  max-width: 1160px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.tabbar { display: none; }

@media (max-width: 899px) {
  .side { display: none; }
  .main { margin-left: 0; }
  .view {
    padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 14px;
  }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  }
  .tabbar a {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px;
    color: var(--ink-3); text-decoration: none; font-size: 11.5px; font-weight: 500; min-height: 48px; justify-content: center;
  }
  .tabbar a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  .tabbar .dot { position: absolute; top: 4px; left: 50%; margin-left: 8px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--wait); color: var(--surface); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  body.focus .tabbar { display: none; }
  body.focus .view { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- page header ---------- */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.ph-l { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.ph h1 { font-size: 24px; font-weight: 700; letter-spacing: -.015em; }
.eyebrow { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-bottom: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ph-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { margin-top: 2px; }
@media (max-width: 899px) {
  .ph { align-items: flex-start; }
  .ph h1 { font-size: 20px; }
  .ph-actions { width: 100%; }
  .ph-actions .btn { flex: 1 1 auto; }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px;
  border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14.5px; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-ink); }
.btn.primary:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
.btn.danger { color: var(--debt); border-color: var(--line-strong); }
.btn.danger-fill { background: var(--debt); border-color: var(--debt); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13.5px; }
.btn.lg { min-height: 50px; font-size: 16px; padding: 0 20px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-sm); border: 1px solid transparent;
  background: transparent; color: var(--ink-2); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.bordered { border-color: var(--line-strong); background: var(--surface); }
.icon-btn[disabled] { opacity: .35; cursor: default; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 600; }
.card-b { padding: 16px 18px; }
.card-f { padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r) var(--r); }
@media (max-width: 899px) { .card-h, .card-b, .card-f { padding-left: 14px; padding-right: 14px; } }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.grid-73 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 899px) { .grid-2, .grid-73 { grid-template-columns: minmax(0, 1fr); gap: 14px; } }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.kpi .val { font-size: 23px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.25; }
.kpi .val small { font-size: 14px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.kpi .note { font-size: 13px; color: var(--ink-3); }
@media (max-width: 1100px) { .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 899px) {
  .kpis, .kpis.k5 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 12px; }
  .kpi .val { font-size: 19px; }
}
@media (max-width: 380px) { .kpi .val { font-size: 17px; } }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap;
}
.chip.debt { background: var(--debt-soft); color: var(--debt); border-color: transparent; }
.chip.paid { background: var(--paid-soft); color: var(--paid); border-color: transparent; }
.chip.wait { background: var(--wait-soft); color: var(--wait); border-color: transparent; }
.chip.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.area {
  display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent); letter-spacing: .02em;
}
.code { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; text-decoration: none; }
a.code:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- meter ---------- */
.meter { height: 6px; border-radius: 99px; background: var(--meter); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.meter.warn > i { background: var(--wait); }
.meter.over > i { background: var(--debt); }
.meter.ok > i { background: var(--paid); }

/* ---------- banners ---------- */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); flex-wrap: wrap; }
.banner .ic { color: var(--accent); }
.banner .txt { flex: 1 1 260px; min-width: 0; }
.banner.warn { background: var(--wait-soft); }
.banner.warn .ic { color: var(--wait); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list > .li { border-top: 1px solid var(--line); }
.list > .li:first-child { border-top: 0; }
a.li, .li.link { color: inherit; text-decoration: none; cursor: pointer; }
a.li:hover, .li.link:hover { background: var(--surface-2); }
.empty { padding: 28px 18px; text-align: center; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty b { color: var(--ink); font-weight: 600; }

/* area bars */
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.bar-row .meter { height: 10px; }
.bar-row .amt { font-weight: 600; }
.bar-row .meta { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-3); margin-top: -2px; }

/* attention / generic rows */
.row2 { display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
.row2 .grow { flex: 1 1 auto; min-width: 0; }
.row2 .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row2 .right { text-align: right; flex: none; }
@media (max-width: 899px) { .row2 { padding: 12px 14px; } }

/* customers table */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 18px; height: 18px; }
.search input { padding-left: 38px; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.seg button {
  height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-ink); }
.thead { display: grid; padding: 9px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink-3); gap: 14px; }
.cust-grid { grid-template-columns: minmax(0, 2.2fr) 56px minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 1.1fr); }
.cust-row { display: grid; gap: 4px 14px; align-items: center; padding: 12px 18px; }
.cust-row .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cust-row .c-debt { font-weight: 700; font-size: 15.5px; }
.cust-row .lim .sub { margin-top: 4px; }
@media (max-width: 899px) {
  .thead { display: none; }
  .cust-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n d" "a l" "m m"; padding: 12px 14px; }
  .cust-row .c-n { grid-area: n; } .cust-row .c-debt { grid-area: d; }
  .cust-row .c-a { grid-area: a; } .cust-row .c-last { grid-area: l; text-align: right; }
  .cust-row .lim { grid-area: m; }
  .cust-row .c-last .sub { display: inline; }
}

/* ledger */
.led-grid { grid-template-columns: 96px 108px minmax(0, 1fr) 130px 130px 140px 40px; }
.led-row { display: grid; gap: 4px 14px; align-items: center; padding: 10px 18px; }
.led-row .what { min-width: 0; }
.led-row .what .t { font-weight: 500; }
.led-row .bal { font-weight: 700; }
.led-total { display: grid; gap: 14px; padding: 12px 18px; background: var(--surface-2); border-top: 1px solid var(--line-strong); font-weight: 700; align-items: center; border-radius: 0 0 var(--r) var(--r); }
@media (max-width: 899px) {
  .led-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "w amt" "w bal"; padding: 10px 14px; }
  .led-row .d { display: none; } .led-row .c { display: none; }
  .led-row .what { grid-area: w; } .led-row .amt { grid-area: amt; }
  .led-row .inc:empty, .led-row .dec:empty { display: none; }
  .led-row .inc, .led-row .dec { grid-area: amt; }
  .led-row .meta-m { grid-area: meta; display: flex !important; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
  .led-row .bal { grid-area: bal; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .led-row .del { display: none; }
  .led-total { grid-template-columns: minmax(0, 1fr) auto !important; }
  .led-total .hide-m { display: none; }
}
.meta-m { display: none !important; }
.led-row .what .meta-m { margin-top: 2px; }

/* trip stops (draft editor) */
.stop-grid { grid-template-columns: 30px minmax(0, 1.6fr) 118px 150px minmax(0, 1.2fr) 128px 126px; }
.stop-row { display: grid; gap: 8px 14px; align-items: center; padding: 10px 18px; }
.stop-row .idx { font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stop-row .nm { font-weight: 600; }
.stop-row .tot { font-weight: 700; }
.stop-row .ops { display: flex; gap: 2px; justify-content: flex-end; }
.stop-row .lbl-m { display: none; }
.stop-total { display: grid; gap: 14px; padding: 12px 18px; background: var(--surface-2); border-top: 1px solid var(--line-strong); font-weight: 700; align-items: center; }
@media (max-width: 899px) {
  .stop-row { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "i n n" "i o t" "i g g" "i x x" "i p p"; padding: 12px 14px; }
  .stop-row .idx { grid-area: i; align-self: start; padding-top: 2px; }
  .stop-row .who { grid-area: n; }
  .stop-row .old { grid-area: o; text-align: left; }
  .stop-row .tot { grid-area: t; }
  .stop-row .goods { grid-area: g; }
  .stop-row .gnote { grid-area: x; }
  .stop-row .ops { grid-area: p; justify-content: flex-start; }
  .stop-row .lbl-m { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .stop-total { grid-template-columns: minmax(0, 1fr) auto !important; }
  .stop-total .hide-m { display: none; }
}

/* trip stop cards (active) */
.stop-card { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 18px; align-items: center; }
.stop-card .idx { width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.stop-card.done .idx { background: var(--paid-soft); color: var(--paid); border-color: transparent; }
.stop-card .nm { font-weight: 600; font-size: 15.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stop-card .st { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
@media (max-width: 899px) { .stop-card { padding: 14px; } }

/* progress summary */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress .meter { height: 10px; }
.prog-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.prog-top .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lb { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 12.5px; color: var(--ink-3); }
.inp, select.inp, textarea.inp {
  width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); font-size: 16px;
}

  <aside class="side" aria-label="Menu">
    <div class="brand"><div class="brand-mark" aria-hidden="true">HT</div><div style="min-width:0"><div class="brand-name" id="brandName">Phụ tùng Hữu Thuỳ</div><div class="brand-sub">Sổ công nợ</div></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot" id="sideFoot"></div>

<script>
(() => {
/* Bản chạy trực tiếp trên máy */
const HOSTED = false;
const hostedSave = null;

/* ===== Sổ công nợ phụ tùng — dữ liệu & quy tắc tính nợ ===== */
'use strict';
const KEY = 'socongno.v1';
const WARRANTY_LATE = 14; // số ngày chờ hãng bắt đầu cảnh báo
const SHOP = 'Phụ tùng Hữu Thuỳ';
const OLD_NAMES = ['Đại lý phụ tùng', 'Đại lý phụ tùng (mẫu)'];

/* ---------- tiện ích ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoOf(new Date(y, m - 1, d + n)); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
const fmtDateShort = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const grp = n => String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const money = (n, sign) => { n = Math.round(n || 0); return (n < 0 ? '−' : (sign && n > 0 ? '+' : '')) + grp(n) + ' đ'; };
const sum = arr => arr.reduce((s, x) => s + (Number(x) || 0), 0);
const ago = days => days <= 0 ? 'hôm nay' : days === 1 ? 'hôm qua' : `${days} ngày trước`;

/* Đọc số tiền người dùng gõ: "1.250.000", "1250000", "200k", "1,5tr", "-300.000" */
function parseMoney(v) {
  if (v == null) return 0;
  let s = String(v).trim().toLowerCase().replace(/\s|đ|vnd/g, '');
  if (!s) return 0;
  let neg = false;
  if (/^[-−]/.test(s)) { neg = true; s = s.slice(1); }
  let mult = 1;
  if (/(tr|m)$/.test(s)) { mult = 1e6; s = s.replace(/(tr|m)$/, ''); }
  else if (/k$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  let n;
  if (mult > 1) {
    // "1,5tr" hoặc "1.5tr" là số thập phân; "1.500k" là nhóm nghìn
    const dec = s.match(/^(\d+)[.,](\d{1,2})$/);
    n = dec ? parseFloat(dec[1] + '.' + dec[2]) : parseFloat(s.replace(/[.,]/g, ''));
  } else {
    n = parseInt(s.replace(/[.,]/g, ''), 10);
  }
  if (!isFinite(n)) return 0;
  n = Math.round(n * mult);
  return neg ? -n : n;
}

/* ---------- trạng thái ---------- */
let S = null;
let storageOK = true;

function emptyState() {
  return {
    version: 1, seq: 0,
    settings: { shopName: SHOP, staleDays: 30, isSample: false, lastBackup: null },
    areas: [
      { id: uid(), code: 'TĐ', name: 'Tuyến TĐ' },
      { id: uid(), code: 'QT', name: 'Tuyến QT' },
      { id: uid(), code: 'ĐT', name: 'Tuyến ĐT' },
    ],
    brands: [], customers: [], entries: [], trips: [], warranty: [],
  };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.version === 1 && Array.isArray(d.customers)) {
        if (d.settings && OLD_NAMES.includes(d.settings.shopName)) d.settings.shopName = SHOP;
        return d;
      }
    }
  } catch (e) { storageOK = false; }
  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}
let saveTimer = null;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); save(); });

/* ---------- tra cứu ---------- */
const areaOf = id => S.areas.find(a => a.id === id);
const brandOf = id => S.brands.find(b => b.id === id);
const custOf = id => S.customers.find(c => c.id === id);
const tripOf = id => S.trips.find(t => t.id === id);
const byEntry = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq;

function balance(cid, excludeTrip) {
  let b = 0;
  for (const e of S.entries) if (e.customerId === cid && (!excludeTrip || e.tripId !== excludeTrip)) b += e.amount;
  return b;
}
function entriesOf(cid) { return S.entries.filter(e => e.customerId === cid).sort(byEntry); }
function lastPaymentDate(cid) {
  let d = null;
  for (const e of S.entries) if (e.customerId === cid && e.type === 'payment' && (!d || e.date > d)) d = e.date;
  return d;
}
function firstEntryDate(cid) {
  let d = null;
  for (const e of S.entries) if (e.customerId === cid && (!d || e.date < d)) d = e.date;
  return d;
}
/* Số ngày khách chưa trả: tính từ lần trả gần nhất, hoặc từ lần phát sinh đầu tiên nếu chưa từng trả */
function daysUnpaid(cid) {
  const d = lastPaymentDate(cid) || firstEntryDate(cid);
  return d ? daysBetween(d, todayISO()) : 0;
}
function custStatus(c, bal) {
  bal = bal ?? balance(c.id);
  const pct = c.limit > 0 ? bal / c.limit : 0;
  const flags = [];
  if (c.limit > 0 && bal > c.limit) flags.push({ k: 'over', t: 'Vượt hạn mức', cls: 'debt' });
  else if (c.limit > 0 && pct >= .9) flags.push({ k: 'near', t: 'Gần hạn mức', cls: 'wait' });
  if (bal > 0 && daysUnpaid(c.id) > S.settings.staleDays) flags.push({ k: 'stale', t: `${daysUnpaid(c.id)} ngày chưa trả`, cls: 'wait' });
  if (bal < 0) flags.push({ k: 'credit', t: 'Khách trả dư', cls: 'info' });
  return { pct, flags };
}
function addEntry(e) {
  S.seq += 1;
  const row = Object.assign({ id: uid(), seq: S.seq, note: '', tripId: null, stopId: null, createdAt: Date.now() }, e);
  S.entries.push(row);
  return row;
}

const ENTRY_LABEL = { opening: 'Nợ đầu kỳ', delivery: 'Giao hàng', return: 'Trả hàng nguyên mác', payment: 'Thanh toán', adjust: 'Điều chỉnh' };
function entryLabel(e) {
  if (e.type === 'payment' && !e.tripId) return 'Thu tại kho';
  if (e.type === 'adjust') return e.amount >= 0 ? 'Điều chỉnh tăng' : 'Điều chỉnh giảm';
  return ENTRY_LABEL[e.type] || e.type;
}

/* ---------- khách hàng ---------- */
function createCustomer(f, date) {
  const c = { id: uid(), name: f.name.trim(), owner: (f.owner || '').trim(), phone: (f.phone || '').trim(), address: (f.address || '').trim(), areaId: f.areaId || null, limit: f.limit || 0, note: (f.note || '').trim(), createdAt: Date.now() };
  S.customers.push(c);
  if (f.opening) addEntry({ customerId: c.id, date: date || todayISO(), type: 'opening', amount: f.opening, note: 'Chuyển từ sổ giấy' });
  return c;
}

/* ---------- chuyến hàng ---------- */
function tripCode(date) {
  const same = S.trips.filter(t => t.date === date).length + 1;
  return `CH-${date.slice(8, 10)}${date.slice(5, 7)}-${same}`;
}
function createTrip(date) {
  const t = { id: uid(), code: tripCode(date), date, status: 'draft', note: '', stops: [], createdAt: Date.now(), startedAt: null, closedAt: null };
  S.trips.push(t);
  return t;
}
function addStop(trip, cid, goods = 0, goodsNote = '') {
  if (trip.stops.some(s => s.customerId === cid)) return null;
  const s = { id: uid(), customerId: cid, goods, goodsNote, returns: [], payment: 0, visited: false, oldDebt: null, savedAt: null };
  trip.stops.push(s);
  return s;
}
function stopCalc(trip, stop) {
  const old = stop.oldDebt != null ? stop.oldDebt : balance(stop.customerId, trip.id);
  const goods = stop.goods || 0;
  const ret = sum(stop.returns.map(r => r.value));
  const pay = stop.visited ? (stop.payment || 0) : 0;
  const total = old + goods;
  return { old, goods, total, ret, pay, remain: total - ret - pay };
}
function tripCalc(trip) {
  let due = 0, plannedDue = 0, ret = 0, paid = 0, remain = 0, visited = 0, goods = 0, old = 0;
  for (const s of trip.stops) {
    const c = stopCalc(trip, s);
    plannedDue += c.total; old += c.old; goods += c.goods;
    if (s.visited) { visited++; due += c.total; ret += c.ret; paid += c.pay; remain += c.remain; }
  }
  const qd = S.warranty.filter(w => w.tripId === trip.id).length;
  return { due, plannedDue, ret, paid, remain, visited, n: trip.stops.length, goods, old, qd };
}
function stopState(trip, stop) {
  if (!stop.visited) return { t: 'Chưa ghé', cls: '' };
  const c = stopCalc(trip, stop);
  return c.remain > 0 ? { t: 'Còn nợ', cls: 'debt' } : { t: 'Đã thu đủ', cls: 'paid' };
}

/* Lưu phiếu thu: ghi lại các dòng sổ nợ của điểm giao này (ghi đè nếu lưu lại) */
function saveStop(trip, stop, d) {
  if (stop.oldDebt == null) stop.oldDebt = balance(stop.customerId, trip.id);
  stop.goods = d.goods || 0;
  stop.goodsNote = d.goodsNote || '';
  stop.returns = d.returns.map(r => ({ id: r.id || uid(), name: r.name, qty: r.qty, value: r.value }));
  stop.payment = d.payment || 0;
  stop.visited = true;
  stop.savedAt = Date.now();

  S.entries = S.entries.filter(e => e.stopId !== stop.id);
  const cid = stop.customerId;
  if (stop.goods > 0) addEntry({ customerId: cid, date: trip.date, type: 'delivery', amount: stop.goods, note: stop.goodsNote, tripId: trip.id, stopId: stop.id });
  const ret = sum(stop.returns.map(r => r.value));
  if (ret > 0) addEntry({ customerId: cid, date: trip.date, type: 'return', amount: -ret, note: stop.returns.map(r => `${r.name} × ${r.qty}`).join(', '), tripId: trip.id, stopId: stop.id });
  if (stop.payment > 0) addEntry({ customerId: cid, date: trip.date, type: 'payment', amount: -stop.payment, note: '', tripId: trip.id, stopId: stop.id });

  // Hàng quay đầu nhận ở điểm giao này: đồng bộ theo bản nháp
  const keep = new Set(d.qd.map(q => q.id));
  S.warranty = S.warranty.filter(w => !(w.stopId === stop.id && !keep.has(w.id) && w.status === 'waiting'));
  for (const q of d.qd) {
    const w = S.warranty.find(x => x.id === q.id);
    if (w) Object.assign(w, { name: q.name, brandId: q.brandId, qty: q.qty, value: q.value, defect: q.defect });
    else S.warranty.push({ id: q.id || uid(), customerId: cid, name: q.name, brandId: q.brandId, qty: q.qty, value: q.value, defect: q.defect, status: 'waiting', outcome: null, receivedDate: trip.date, tripId: trip.id, stopId: stop.id, sentDate: null, resolvedDate: null, doneDate: null, doneTripId: null, doneStopId: null, prevStatus: null });
  }
  // Hàng giao lại cho khách (đổi bảo hành hoặc trả lại hàng lỗi)
  for (const w of S.warranty) {
    if (w.customerId !== cid) continue;
    const ticked = d.back.has(w.id);
    if (ticked && (w.status === 'accepted' || w.status === 'rejected')) {
      w.prevStatus = w.status; w.outcome = w.status === 'accepted' ? 'exchanged' : 'returned';
      w.status = 'done'; w.doneDate = trip.date; w.doneTripId = trip.id; w.doneStopId = stop.id;
    } else if (!ticked && w.status === 'done' && w.doneStopId === stop.id) {
      w.status = w.prevStatus || (w.outcome === 'exchanged' ? 'accepted' : 'rejected');
      w.outcome = null; w.doneDate = null; w.doneTripId = null; w.doneStopId = null;
    }
  }
}
function startTrip(trip) { trip.status = 'active'; trip.startedAt = Date.now(); }
function closeTrip(trip) {
  for (const s of trip.stops) if (s.oldDebt == null) s.oldDebt = balance(s.customerId, trip.id);
  trip.status = 'closed'; trip.closedAt = Date.now();
}
function reopenTrip(trip) {
  trip.status = 'active'; trip.closedAt = null;
  for (const s of trip.stops) if (!s.visited) s.oldDebt = null;
}
function deleteTrip(trip) {
  S.entries = S.entries.filter(e => e.tripId !== trip.id);
  S.warranty = S.warranty.filter(w => w.tripId !== trip.id);
  S.trips = S.trips.filter(t => t.id !== trip.id);
}
function removeStop(trip, stop) {
  S.entries = S.entries.filter(e => e.stopId !== stop.id);
  S.warranty = S.warranty.filter(w => w.stopId !== stop.id);
  trip.stops = trip.stops.filter(s => s.id !== stop.id);
}

const W_TAB = { waiting: 'Chờ gửi hãng', sent: 'Đã gửi hãng', back: 'Chờ giao lại khách', done: 'Đã xong' };
function wTabOf(w) { return w.status === 'accepted' || w.status === 'rejected' ? 'back' : w.status; }
function wSince(w) {
  if (w.status === 'waiting') return w.receivedDate;
  if (w.status === 'sent') return w.sentDate || w.receivedDate;
  if (w.status === 'accepted' || w.status === 'rejected') return w.resolvedDate || w.receivedDate;
  return w.doneDate;
}
function wDays(w) { return daysBetween(w.receivedDate, w.status === 'done' ? w.doneDate : todayISO()); }
function wSet(w, status, date) {
  date = date || todayISO();
  w.prevStatus = w.status;
  if (status === 'sent') w.sentDate = date;
  if (status === 'accepted' || status === 'rejected') w.resolvedDate = date;
  if (status === 'done') { w.doneDate = date; w.outcome = w.status === 'accepted' ? 'exchanged' : 'returned'; }
  w.status = status;
}
function wUndo(w) {
  const back = { sent: 'waiting', accepted: 'sent', rejected: w.sentDate ? 'sent' : 'waiting', done: w.outcome === 'exchanged' ? 'accepted' : 'rejected' }[w.status];
  if (!back) return;
  if (w.status === 'done') { w.doneDate = null; w.doneTripId = null; w.doneStopId = null; w.outcome = null; }
  if (w.status === 'accepted' || w.status === 'rejected') w.resolvedDate = null;
  if (w.status === 'sent') w.sentDate = null;
  w.status = back;
}
function wPendingBack(cid) { return S.warranty.filter(w => w.customerId === cid && (w.status === 'accepted' || w.status === 'rejected')); }

/* SHA-256 (để không lưu mật khẩu dạng chữ thường) */
const sha256 = (() => {
  const K = [], H0 = [];
  const frac = x => ((x - Math.floor(x)) * 4294967296) >>> 0;
  for (let n = 2, found = 0; found < 64; n++) {
    let prime = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
    if (!prime) continue;
    if (found < 8) H0.push(frac(Math.sqrt(n)));
    K.push(frac(Math.cbrt(n)));
    found++;
  }
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  return msg => {
    const bytes = new TextEncoder().encode(String(msg));
    const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
    const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(total - 8, Math.floor(len / 0x20000000)); dv.setUint32(total - 4, (len << 3) >>> 0);
    const H = H0.slice(), w = new Uint32Array(64);
    for (let i = 0; i < total; i += 64) {
      for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
      for (let t = 16; t < 64; t++) {
        const s0 = ror(w[t - 15], 7) ^ ror(w[t - 15], 18) ^ (w[t - 15] >>> 3);
        const s1 = ror(w[t - 2], 17) ^ ror(w[t - 2], 19) ^ (w[t - 2] >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let t = 0; t < 64; t++) {
        const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + w[t]) >>> 0;
        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(x => x.toString(16).padStart(8, '0')).join('');
  };
})();

let ACC = { users: [] };
let SESSION = null;

function normIdent(s) {
  s = String(s || '').trim().toLowerCase();
  if (/^[+\d\s.()-]+$/.test(s)) {
    s = s.replace(/[^\d+]/g, '');
    if (s.startsWith('+84')) s = '0' + s.slice(3);
    else if (s.startsWith('84') && s.length === 11) s = '0' + s.slice(2);
  }
  return s;
}
function identKind(s) {
  if (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s)) return 'email';
  if (/^0\d{9}$/.test(s)) return 'phone';
  return null;
}
function makeUser(name, ident, pw) {
  const salt = uid();
  return { id: uid(), name: name.trim(), ident: normIdent(ident), salt, hash: sha256(salt + ':' + pw), createdAt: Date.now() };
}
function saveAccounts() { try { localStorage.setItem(AUTH_KEY, JSON.stringify(ACC)); } catch (e) { /* bỏ qua */ } }
function loadAccounts() {
  try { const d = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); if (d && Array.isArray(d.users)) ACC = d; } catch (e) { /* bỏ qua */ }
  if (!ACC.users.some(u => u.ident === DEMO.ident)) { ACC.users.push(makeUser(DEMO.name, DEMO.ident, DEMO.password)); saveAccounts(); }
}
function checkLogin(ident, pw) {
  const u = ACC.users.find(x => x.ident === normIdent(ident));
  return u && u.hash === sha256(u.salt + ':' + pw) ? u : null;
}
function startSession(u, remember) {
  SESSION = { userId: u.id, exp: Date.now() + (remember ? 30 * 86400000 : 12 * 3600000), remember: !!remember };
  const raw = JSON.stringify(SESSION);
  try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* bỏ qua */ }
  try { (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, raw); } catch (e) { /* phiên chỉ giữ trong trang */ }
}
function loadSession() {
  SESSION = null;
  for (const get of [() => sessionStorage, () => localStorage]) {
    try {
      const s = JSON.parse(get().getItem(SESSION_KEY) || 'null');
      if (s && s.exp > Date.now() && ACC.users.some(u => u.id === s.userId)) { SESSION = s; return; }
    } catch (e) { /* bỏ qua */ }
  }
}
function endSession() {
  SESSION = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* bỏ qua */ }
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* bỏ qua */ }
}
const currentUser = () => SESSION ? ACC.users.find(u => u.id === SESSION.userId) || null : null;
const initials = name => { const w = String(name || '?').trim().split(/\s+/); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); };

const NAV = [

  { r: 'trips', label: 'Chuyến hàng', short: 'Chuyến', ic: 'truck' },

async function go(route, opts = {}) {
  if (UI.draft && UI.draft.dirty && !opts.force && route !== UI.route) {
    const ok = await confirmBox('Phiếu thu chưa lưu', 'Bạn đã sửa phiếu thu này nhưng chưa bấm Lưu. Rời trang sẽ bỏ các thay đổi đó.', 'Bỏ thay đổi', true);
    if (!ok) return;
  }
  UI.draft = null;
  UI.route = route;
  if (!HOSTED && !opts.noHistory) { try { history.pushState({ r: route }, '', '#' + route); } catch (e) { /* bỏ qua */ } }
  render();
  window.scrollTo(0, 0);
}
if (!HOSTED) {
  window.addEventListener('popstate', ev => { UI.draft = null; UI.route = (ev.state && ev.state.r) || location.hash.slice(1) || ''; render(); });
}

function renderNav() {
  const sec = SECTION_OF[UI.route.split('/')[0]] ?? UI.route.split('/')[0];
  const nW = S.warranty.filter(w => w.status !== 'done').length;
  const nActive = S.trips.filter(t => t.status === 'active').length;
  $('#sideNav').innerHTML = NAV.map(n => `<a href="#${n.r}" data-go="${n.r}" ${sec === n.r ? 'aria-current="page"' : ''}>${icon(n.ic)}<span>${n.label}</span>${n.r === 'returns' && nW ? `<span class="count">${nW}</span>` : ''}${n.r === 'trips' && nActive ? `<span class="count" title="Chuyến đang đi giao">${nActive}</span>` : ''}</a>`).join('');
  $('#tabBar').innerHTML = NAV.map(n => `<a href="#${n.r}" data-go="${n.r}" ${sec === n.r ? 'aria-current="page"' : ''}>${icon(n.ic)}<span>${n.short}</span>${n.r === 'returns' && nW ? `<span class="dot">${nW}</span>` : ''}${n.r === 'trips' && nActive ? `<span class="dot">${nActive}</span>` : ''}</a>`).join('');

}

/* ---------- hộp thoại ---------- */
function openDialog({ title, body, okLabel = 'Lưu', okCls = 'primary', cancelLabel = 'Huỷ', onOk, onOpen, hideOk }) {
  const d = $('#dlg');
  d.innerHTML = `<form class="dlg-form" novalidate><div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Đóng">${icon('x')}</button></div><div class="dlg-body">${body}</div><div class="dlg-err" role="alert"></div><div class="dlg-foot"><button type="button" class="btn" data-close>${esc(cancelLabel)}</button>${hideOk ? '' : `<button type="submit" class="btn ${okCls}">${esc(okLabel)}</button>`}</div></form>`;
  const form = d.querySelector('form');
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    const err = onOk ? onOk(form) : null;
    if (err) { d.querySelector('.dlg-err').textContent = err; return; }
    closeDialog();
  });
  form.addEventListener('input', () => { d.querySelector('.dlg-err').textContent = ''; });
  d.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { closeDialog(); d._resolve && d._resolve(false); }));
  d.onclose = () => { d._resolve && d._resolve(false); d._resolve = null; };
  try { d.showModal(); } catch (e) { d.setAttribute('open', ''); }
  if (onOpen) onOpen(d);
  const first = d.querySelector('.dlg-body input:not([type=checkbox]):not([readonly]), .dlg-body select, .dlg-body textarea');
  if (first && window.matchMedia('(min-width: 900px)').matches) first.focus();
  return d;
}
function closeDialog() { const d = $('#dlg'); try { d.close(); } catch (e) { d.removeAttribute('open'); } }
function confirmBox(title, msg, okLabel = 'Đồng ý', danger = false) {
  return new Promise(res => {
    const d = openDialog({ title, body: `<p style="margin:0;color:var(--ink-2)">${msg}</p>`, okLabel, okCls: danger ? 'danger-fill' : 'primary', onOk: () => { const r = d._resolve; d._resolve = null; r && r(true); } });
    d._resolve = res;
  });
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
const val = (f, name) => (f.elements[name] ? f.elements[name].value : '').trim();

/* ---------- ô nhập tiền: tự thêm dấu chấm khi gõ ---------- */
function liveMoney(el) {
  const v = el.value;
  if (/[a-zđ]/i.test(v.replace(/đ/g, ''))) return; // đang gõ 200k / 1,5tr: định dạng khi rời ô
  const neg = el.dataset.money === 'signed' && /^\s*[-−]/.test(v);
  const caret = el.selectionStart ?? v.length;
  const before = v.slice(0, caret).replace(/\D/g, '').length;
  const digits = v.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  const out = (neg ? '-' : '') + (digits ? grp(Number(digits)) : '');
  if (out === v) return;
  el.value = out;
  let pos = neg ? 1 : 0, seen = 0;
  while (pos < out.length && seen < before) { if (/\d/.test(out[pos])) seen++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (e) { /* bỏ qua */ }
}
document.addEventListener('input', e => { if (e.target.matches('[data-money]')) liveMoney(e.target); }, true);
document.addEventListener('blur', e => {
  const el = e.target;
  if (el.matches && el.matches('[data-money]') && el.value) {
    const n = parseMoney(el.value);
    el.value = n ? (n < 0 ? '-' : '') + grp(n) : '';
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
}, true);

const ACT = {};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { if (a.tagName === 'A' || a.tagName === 'BUTTON') e.preventDefault(); ACT[a.dataset.act](a, e); }
});
document.addEventListener('keydown', e => {

});

function sampleBanner() {
  if (!S.settings.isSample) return '';
  return `<div class="banner">${icon('info')}<div class="txt"><b>Đang xem dữ liệu mẫu.</b> Bấm thử thoải mái. Khi muốn ghi sổ thật, xoá dữ liệu mẫu để bắt đầu sổ trống.</div><button class="btn sm" data-act="startReal">Bắt đầu sổ thật</button></div>`;
}
function backupBanner() {
  if (S.settings.isSample || !S.entries.length) return '';
  const lb = S.settings.lastBackup;
  if (lb && daysBetween(lb, todayISO()) < 7) return '';
  return `<div class="banner warn">${icon('alert')}<div class="txt"><b>${lb ? `Đã ${daysBetween(lb, todayISO())} ngày chưa sao lưu.` : 'Chưa sao lưu lần nào.'}</b> Dữ liệu chỉ nằm trên trình duyệt này; nếu xoá lịch sử duyệt web sẽ mất sổ.</div><button class="btn sm" data-act="exportData">${icon('download')}Xuất file sao lưu</button></div>`;
}

function vDashboard() {
  const T = todayISO();
  const rows = S.customers.map(c => ({ c, b: balance(c.id) }));
  const debtors = rows.filter(x => x.b > 0);
  const total = sum(debtors.map(x => x.b));
  const pays = S.entries.filter(e => e.type === 'payment' && e.date === T);
  const paidToday = -sum(pays.map(e => e.amount));
  const active = S.trips.filter(t => t.status === 'active').sort((a, b) => a.date < b.date ? 1 : -1);
  const wOpen = S.warranty.filter(w => w.status !== 'done');
  const wLate = wOpen.filter(w => (w.status === 'waiting' || w.status === 'sent') && wDays(w) >= WARRANTY_LATE);
  const wBack = wOpen.filter(w => w.status === 'accepted' || w.status === 'rejected');

  const activeCards = active.map(t => {
    const k = tripCalc(t);
    const pct = k.plannedDue ? Math.min(1, k.paid / k.plannedDue) : 0;
    return `<a class="card li" href="#trip/${t.id}" data-go="trip/${t.id}" style="text-decoration:none;color:inherit"><div class="card-b progress">
      <div class="prog-top"><div><div class="eyebrow">${chip('Đang đi giao', 'info')} <span class="code">${esc(t.code)}</span> ${fmtDate(t.date)}</div><div style="font-weight:600">${k.visited}/${k.n} khách đã ghé</div></div>
      <div class="num"><span class="sub">Đã thu</span> <span class="big paid">${money(k.paid)}</span><div class="sub">trên ${money(k.plannedDue)} phải thu</div></div></div>
      <div class="meter ok"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
      <div style="display:flex;justify-content:flex-end"><span class="btn sm primary">Tiếp tục chuyến ${icon('chev')}</span></div></div></a>`;
  }).join('');

  // nợ theo khu vực
  const byArea = S.areas.map(a => {
    const list = debtors.filter(x => x.c.areaId === a.id);
    return { a, amt: sum(list.map(x => x.b)), n: list.length };
  });
  const noArea = debtors.filter(x => !areaOf(x.c.areaId));
  if (noArea.length) byArea.push({ a: { code: '—', name: 'Chưa gán tuyến' }, amt: sum(noArea.map(x => x.b)), n: noArea.length });
  const maxA = Math.max(1, ...byArea.map(x => x.amt));
  const bars = byArea.map(x => `<div class="bar-row"><span class="area">${esc(x.a.code)}</span><div class="meter"><i style="width:${(x.amt / maxA * 100).toFixed(1)}%"></i></div><span class="num amt">${money(x.amt)}</span><span class="meta">${esc(x.a.name)} · ${x.n} khách đang nợ · ${total ? Math.round(x.amt / total * 100) : 0}% tổng nợ</span></div>`).join('');

  // khách cần chú ý
  const attention = rows.map(x => ({ ...x, st: custStatus(x.c, x.b) }))
    .filter(x => x.st.flags.some(f => f.k === 'over' || f.k === 'near' || f.k === 'stale'))
    .sort((a, b) => b.b - a.b).slice(0, 6);
  const attHTML = attention.length ? attention.map(x => `<a class="li row2" href="#cust/${x.c.id}" data-go="cust/${x.c.id}"><div class="grow"><div class="nm">${esc(x.c.name)} ${areaTag(x.c.areaId)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${x.st.flags.map(f => chip(f.t, f.cls)).join('')}</div></div><div class="right"><div class="num debt" style="font-weight:700">${money(x.b)}</div>${x.c.limit ? `<div class="sub num">hạn mức ${money(x.c.limit)}</div>` : ''}</div></a>`).join('')
    : `<div class="empty">Không có khách nào vượt hạn mức hay quá ${S.settings.staleDays} ngày chưa trả.</div>`;

  const recent = S.trips.filter(t => t.status === 'closed').sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt)).slice(0, 4);
  const recentHTML = recent.length ? recent.map(t => { const k = tripCalc(t); return `<a class="li row2" href="#trip/${t.id}" data-go="trip/${t.id}"><div class="grow"><div class="nm"><span class="code">${esc(t.code)}</span> ${fmtDate(t.date)}</div><div class="sub">${k.visited} khách · trả hàng ${money(k.ret)}</div></div><div class="right"><div class="num paid" style="font-weight:600">${money(k.paid)}</div><div class="sub">đã thu</div></div></a>`; }).join('')
    : '<div class="empty">Chưa có chuyến nào được chốt.</div>';

  if (!S.customers.length) {
    return header({ eyebrow: fmtDate(T), title: 'Tổng quan' }) + sampleBanner() + `<div class="card"><div class="empty"><b>Sổ đang trống</b>Thêm các tiệm đang lấy hàng, kèm số nợ hiện có trong sổ giấy. Sau đó tạo chuyến đầu tiên.<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="newCustomer">${icon('plus')}Thêm khách hàng</button><button class="btn" data-act="loadSample">Xem dữ liệu mẫu</button></div></div></div>`;
  }

  return header({ eyebrow: `Hôm nay ${fmtDate(T)}`, title: 'Tổng quan', actions: `<button class="btn primary" data-act="newTrip">${icon('plus')}Tạo chuyến</button>` })
    + sampleBanner() + backupBanner() + activeCards
    + `<div class="kpis">
        <div class="card kpi"><span class="lbl">Tổng nợ phải thu</span><span class="val debt">${money(total)}</span><span class="note">${debtors.length} khách đang nợ</span></div>
        <div class="card kpi"><span class="lbl">Đã thu hôm nay</span><span class="val paid">${money(paidToday)}</span><span class="note">${pays.length} lần thu</span></div>
        <div class="card kpi"><span class="lbl">Hàng quay đầu đang xử lý</span><span class="val">${wOpen.length} <small>món</small></span><span class="note">${wLate.length ? `<span class="wait">${wLate.length} món chờ hãng quá ${WARRANTY_LATE} ngày</span>` : 'Không có món chờ quá lâu'}</span></div>
        <div class="card kpi"><span class="lbl">Hàng cần giao lại khách</span><span class="val">${wBack.length} <small>món</small></span><span class="note">Hàng đổi bảo hành, hàng lỗi trả lại</span></div>
      </div>
      <div class="grid-73">
        <div class="card"><div class="card-h"><h2>Khách cần chú ý</h2><button class="btn sm ghost" data-go="customers">Tất cả khách ${icon('chev')}</button></div><div class="list">${attHTML}</div></div>
        <div class="card"><div class="card-h"><h2>Nợ theo tuyến</h2></div><div class="card-b bars">${bars || '<div class="empty">Chưa có tuyến.</div>'}</div></div>
      </div>
      <div class="card"><div class="card-h"><h2>Chuyến đã chốt gần đây</h2><button class="btn sm ghost" data-go="trips">Tất cả chuyến ${icon('chev')}</button></div><div class="list">${recentHTML}</div></div>`;
}

function vTrip(id) {

/* ---- Sổ chốt hàng đi (nháp) ---- */
function vTripDraft(t) {
  const k = tripCalc(t);
  const rows = t.stops.map((s, i) => {
    const c = custOf(s.customerId); const x = stopCalc(t, s);
    const over = c && c.limit && x.total > c.limit;
    return `<div class="li stop-row stop-grid" data-stop="${s.id}">
      <div class="idx">${i + 1}</div>
      <div class="who" style="min-width:0"><div class="nm">${esc(c ? c.name : '(khách đã xoá)')} ${c ? areaTag(c.areaId) : ''}</div><div class="sub">${c && c.phone ? esc(c.phone) : ''}</div></div>
      <div class="old num"><span class="lbl-m">Nợ cũ</span>${money(x.old)}</div>
      <div class="goods"><label class="lbl-m" for="g-${s.id}">Hàng chuyến này</label>${moneyInput('g-' + s.id, s.goods, `data-goods="${s.id}" aria-label="Hàng chuyến này"`)}</div>
      <div class="gnote"><label class="lbl-m" for="n-${s.id}">Ghi chú hàng</label><input class="inp" id="n-${s.id}" data-gnote="${s.id}" value="${esc(s.goodsNote)}" placeholder="VD: 3 bộ nhông sên đĩa, 2 bugi" aria-label="Ghi chú hàng"></div>
      <div class="tot num"><span class="lbl-m">Tổng phải thu</span><span data-tot="${s.id}" class="${over ? 'debt' : ''}">${money(x.total)}</span>${over ? `<div class="sub debt" data-over="${s.id}">vượt hạn mức</div>` : `<div class="sub" data-over="${s.id}"></div>`}</div>
      <div class="ops"><button class="icon-btn" data-act="moveStop" data-dir="-1" data-id="${s.id}" ${i === 0 ? 'disabled' : ''} aria-label="Lên trên">${icon('up')}</button><button class="icon-btn" data-act="moveStop" data-dir="1" data-id="${s.id}" ${i === t.stops.length - 1 ? 'disabled' : ''} aria-label="Xuống dưới">${icon('down')}</button><button class="icon-btn" data-act="dropStop" data-id="${s.id}" aria-label="Bỏ khách khỏi chuyến">${icon('trash')}</button></div>
    </div>`;
  }).join('');
  return header({ back: 'trips', eyebrow: `Sổ chốt hàng đi ${chip('Nháp')}`, title: `Chuyến <span class="mono">${esc(t.code)}</span>`, actions: `<button class="btn" data-go="print-trip/${t.id}">${icon('print')}Bản in sổ</button><button class="btn danger" data-act="deleteTrip" data-id="${t.id}">${icon('trash')}Xoá nháp</button>` })

    <div class="card" id="tripEd">

      ${t.stops.length ? `<div class="thead stop-grid"><span>#</span><span>Khách hàng</span><span class="num">Nợ cũ</span><span class="num">Hàng chuyến này</span><span>Ghi chú hàng</span><span class="num">Tổng phải thu</span><span></span></div>
      <div class="list">${rows}</div>
      <div class="stop-total stop-grid"><span class="hide-m"></span><span>Tổng cộng</span><span class="num hide-m" id="sumOld">${money(k.old)}</span><span class="num hide-m" id="sumGoods">${money(k.goods)}</span><span class="hide-m"></span><span class="num debt" id="sumDue">${money(k.plannedDue)}</span><span class="hide-m"></span></div>`
      : `<div class="empty"><b>Chưa có khách</b>Thêm các tiệm sẽ giao trong chuyến này. Nợ cũ của từng tiệm được lấy tự động.<button class="btn primary" data-act="addStops" data-id="${t.id}">${icon('plus')}Thêm khách</button></div>`}
    </div>
    <div class="ph-actions no-print" style="justify-content:flex-end"><button class="btn primary lg" data-act="startTrip" data-id="${t.id}" ${t.stops.length ? '' : 'disabled'}>${icon('truck')}Bắt đầu đi giao</button></div>`;
}
afterRender.trip = id => {
  const t = tripOf(id); if (!t || t.status !== 'draft') return;
  const dt = $('#tripDate'); if (dt) dt.addEventListener('change', () => { if (dt.value) { t.date = dt.value; save(); } });
  const nt = $('#tripNote'); if (nt) nt.addEventListener('input', () => { t.note = nt.value; persist(); });
  $('#tripEd').addEventListener('input', e => {
    const g = e.target.dataset.goods, n = e.target.dataset.gnote;
    if (g) {
      const s = t.stops.find(x => x.id === g); if (!s) return;
      s.goods = Math.max(0, parseMoney(e.target.value));
      const x = stopCalc(t, s); const c = custOf(s.customerId); const over = c && c.limit && x.total > c.limit;
      const tot = $(`[data-tot="${g}"]`); tot.textContent = money(x.total); tot.className = over ? 'debt' : '';
      $(`[data-over="${g}"]`).textContent = over ? 'vượt hạn mức' : '';
      const k = tripCalc(t); $('#sumGoods').textContent = money(k.goods); $('#sumDue').textContent = money(k.plannedDue);
      persist();
    } else if (n) {
      const s = t.stops.find(x => x.id === n); if (s) { s.goodsNote = e.target.value; persist(); }
    }
  });
};
ACT.moveStop = el => {
  const t = tripOf(UI.route.split('/')[1]); const i = t.stops.findIndex(s => s.id === el.dataset.id); const j = i + Number(el.dataset.dir);
  if (j < 0 || j >= t.stops.length) return;
  [t.stops[i], t.stops[j]] = [t.stops[j], t.stops[i]]; save(); render();
};
ACT.dropStop = async el => {
  const t = tripOf(UI.route.split('/')[1]); const s = t.stops.find(x => x.id === el.dataset.id); if (!s) return;
  if (s.visited) {
    const ok = await confirmBox('Bỏ khách đã ghi phiếu thu?', 'Các dòng giao hàng, trả hàng và thanh toán của khách này trong chuyến sẽ bị xoá khỏi sổ nợ.', 'Bỏ khách', true);

};
ACT.deleteTrip = async el => {

  const ok = await confirmBox(`Xoá chuyến ${t.code}?`, anyVisited ? 'Chuyến đã có phiếu thu. Xoá chuyến sẽ xoá luôn các dòng sổ nợ và hàng quay đầu ghi trong chuyến.' : 'Chuyến nháp và danh sách khách sẽ bị xoá. Sổ nợ không thay đổi.', 'Xoá chuyến', true);
  if (!ok) return;
  deleteTrip(t); save(); toast('Đã xoá chuyến'); go('trips', { force: true });
};
ACT.startTrip = el => {
  const t = tripOf(el.dataset.id); if (!t || !t.stops.length) return;
  startTrip(t); save(); toast('Bắt đầu đi giao'); render();
};
ACT.addStops = el => {
  const t = tripOf(el.dataset.id); if (!t) return;
  const inTrip = new Set(t.stops.map(s => s.customerId));
  const cands = S.customers.filter(c => !inTrip.has(c.id)).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
  if (!cands.length) { toast('Mọi khách đã có trong chuyến'); return; }
  const areaBtns = [`<button type="button" data-area="all" aria-pressed="true">Tất cả</button>`].concat(S.areas.map(a => `<button type="button" data-area="${a.id}" aria-pressed="false">${esc(a.code)}</button>`)).join('');
  const list = cands.map(c => `<label class="check" data-area="${c.areaId || ''}" data-name="${esc((c.name + ' ' + c.owner + ' ' + c.phone).toLowerCase())}"><input type="checkbox" name="pick" value="${c.id}"><div class="grow"><div style="font-weight:600">${esc(c.name)} ${areaTag(c.areaId)}</div><div class="sub">${esc(c.owner || '')}</div></div><div class="num ${balance(c.id) > 0 ? 'debt' : 'muted'}" style="font-weight:600">${money(balance(c.id))}</div></label>`).join('');
  openDialog({
    title: 'Thêm khách vào chuyến', okLabel: 'Thêm khách',
    body: `<div class="seg" id="pickArea">${areaBtns}</div><div class="search">${icon('search')}<input class="inp" id="pickQ" placeholder="Tìm tên tiệm, chủ tiệm, SĐT" autocomplete="off"></div><div class="pick" id="pickList">${list}</div><div class="hint sub">Số bên phải là nợ hiện tại của khách.</div>`,
    onOpen: d => {
      let area = 'all';
      const apply = () => { const q = $('#pickQ', d).value.trim().toLowerCase(); $$('#pickList .check', d).forEach(l => { l.hidden = !((area === 'all' || l.dataset.area === area) && (!q || l.dataset.name.includes(q))); }); };
      $('#pickArea', d).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; area = b.dataset.area; $$('#pickArea button', d).forEach(x => x.setAttribute('aria-pressed', x === b)); apply(); });
      $('#pickQ', d).addEventListener('input', apply);
      d.querySelector('form').addEventListener('change', () => { const n = $$('input[name=pick]:checked', d).length; d.querySelector('button[type=submit]').textContent = n ? `Thêm ${n} khách` : 'Thêm khách'; });
    },
    onOk: f => {

      if (!ids.length) return 'Chọn ít nhất một khách.';
      ids.forEach(id => addStop(t, id)); save(); render(); toast(`Đã thêm ${ids.length} khách`);
    },
  });
};

/* ---- Tổng kết chuyến (dùng cho chốt chuyến và chuyến đã chốt) ---- */

      <div class="card kpi"><span class="lbl">Tổng phải thu</span><span class="val">${money(k.due)}</span><span class="note">${k.visited} khách đã ghé</span></div>
      <div class="card kpi"><span class="lbl">Hàng trả lại</span><span class="val">${money(k.ret)}</span><span class="note">Nguyên mác, đã trừ nợ</span></div>

      <div class="card kpi"><span class="lbl">Tổng nợ lại</span><span class="val debt">${money(k.remain)}</span><span class="note">Thành nợ cũ chuyến sau</span></div>
      <div class="card kpi"><span class="lbl">Hàng quay đầu mang về</span><span class="val">${k.qd} <small>món</small></span><span class="note">Chưa trừ tiền</span></div>
    </div>
    <div class="card"><div class="card-h"><h2>Từng khách</h2></div><div class="list">${rows || '<div class="empty">Chưa ghé khách nào.</div>'}</div></div>`;
}

}
ACT.closeTrip = el => { const t = tripOf(el.dataset.id); if (!t) return; closeTrip(t); save(); toast('Đã chốt chuyến'); go('trip/' + t.id, { force: true }); };

/* ---- Phiếu thu ---- */
function vStop(tid, sid) {
  const t = tripOf(tid); const s = t && t.stops.find(x => x.id === sid);
  if (!t || !s) return notFound('phiếu thu này');
  const c = custOf(s.customerId); if (!c) return notFound('khách hàng');
  const ro = t.status === 'closed';
  if (!UI.draft || UI.draft.sid !== sid) {
    const qd = S.warranty.filter(w => w.stopId === s.id).map(w => ({ id: w.id, name: w.name, brandId: w.brandId, qty: w.qty, value: w.value, defect: w.defect, status: w.status }));
    const back = new Set(S.warranty.filter(w => w.customerId === c.id && w.status === 'done' && w.doneStopId === s.id).map(w => w.id));
    UI.draft = { sid, dirty: false, goods: s.goods, goodsNote: s.goodsNote, returns: s.returns.map(r => ({ ...r })), qd, back, payment: s.visited ? s.payment : null };
  }
  const D = UI.draft;
  const old = s.oldDebt != null ? s.oldDebt : balance(c.id, t.id);
  const backList = S.warranty.filter(w => w.customerId === c.id && ((w.status === 'accepted' || w.status === 'rejected') || (w.status === 'done' && w.doneStopId === s.id)));
  const dis = ro ? 'disabled' : '';
  return header({ back: 'trip/' + t.id, eyebrow: `Phiếu thu · <span class="code">${esc(t.code)}</span> ${fmtDate(t.date)}`, title: `${esc(c.name)} ${areaTag(c.areaId)}`, actions: c.phone ? `<span class="btn ghost" style="cursor:default">${icon('phone')}${phoneHTML(c.phone)}</span>` : '' })
    + (ro ? `<div class="banner">${icon('info')}<div class="txt">Chuyến đã chốt nên phiếu này chỉ để xem. Muốn sửa, mở lại chuyến.</div><button class="btn sm" data-act="reopenTrip" data-id="${t.id}">Mở lại chuyến</button></div>` : '')
    + `<div class="card"><div class="card-h"><h2>Tiền hàng</h2>${c.limit ? `<span class="sub num">Hạn mức ${money(c.limit)}</span>` : ''}</div><div class="card-b" style="display:flex;flex-direction:column;gap:14px">
        <div class="rc-sum"><div class="cell"><div class="k">Nợ cũ</div><div class="v">${money(old)}</div></div><div class="cell"><div class="k">Hàng chuyến này</div><div class="v" id="rcGoods">${money(D.goods)}</div></div><div class="cell total"><div class="k">Tổng phải thu</div><div class="v" id="rcTotal">${money(old + (D.goods || 0))}</div></div></div>
        <div class="form-grid"><div class="field"><label for="dGoods">Hàng chuyến này</label>${moneyInput('dGoods', D.goods, dis)}</div><div class="field"><label for="dGoodsNote">Ghi chú hàng</label><input class="inp" id="dGoodsNote" value="${esc(D.goodsNote)}" placeholder="VD: 3 bộ nhông sên đĩa" ${dis}></div></div>
      </div></div>
      <div class="card"><div class="card-h"><h2>Hàng nguyên mác trả lại</h2>${ro ? '' : `<button class="btn sm" data-act="addReturn">${icon('plus')}Thêm món</button>`}</div><div class="card-b" id="retList"></div></div>
      <div class="card"><div class="card-h"><h2>Hàng quay đầu cầm về</h2>${ro ? '' : `<button class="btn sm" data-act="addQD">${icon('plus')}Thêm món</button>`}</div><div class="card-b" id="qdList"></div></div>
      ${backList.length ? `<div class="card"><div class="card-h"><h2>Hàng cần giao lại cho khách</h2><span class="sub">Tick khi đã đưa cho khách</span></div><div class="card-b">${backList.map(w => { const b = brandOf(w.brandId); const kind = (w.status === 'accepted' || w.outcome === 'exchanged') ? 'Hàng đổi bảo hành' : 'Trả lại hàng lỗi'; return `<label class="check item"><input type="checkbox" data-back="${w.id}" ${D.back.has(w.id) ? 'checked' : ''} ${dis}><div class="grow"><div class="nm">${esc(w.name)} × ${w.qty}</div><div class="sub">${kind} · ${esc(b ? b.name : '')} · nhận ${fmtDate(w.receivedDate)}</div></div></label>`; }).join('')}</div></div>` : ''}
      <div class="card"><div class="card-h"><h2>Khách thanh toán</h2></div><div class="card-b">
        <div class="field"><label for="dPay" class="sr">Số tiền khách trả</label>${moneyInput('dPay', D.payment, dis, 'pay-inp')}</div>
        ${ro ? '' : `<div class="quick"><button class="btn sm" data-act="payFull">Trả đủ</button><button class="btn sm" data-act="payZero">Không trả</button><span class="sub" style="align-self:center">Gõ nhanh: 500k, 1,5tr</span></div>`}
      </div></div>
      <div class="savebar"><div><div class="k">Nợ lại</div><div class="v" id="rcRemain"></div></div>${ro ? '' : `<button class="btn primary lg" data-act="saveStop">${icon('check')}Lưu phiếu</button>`}</div>`;
}
function stopDraftCalc() {
  const [, tid, sid] = UI.route.split('/'); const t = tripOf(tid); const s = t.stops.find(x => x.id === sid);
  const old = s.oldDebt != null ? s.oldDebt : balance(s.customerId, t.id);
  const D = UI.draft; const ret = sum(D.returns.map(r => r.value));
  const total = old + (D.goods || 0);
  return { t, s, old, total, ret, remain: total - ret - (D.payment || 0) };
}
function paintStop() {
  const D = UI.draft; if (!D) return;
  const x = stopDraftCalc(); const ro = x.t.status === 'closed';
  $('#rcGoods').textContent = money(D.goods); $('#rcTotal').textContent = money(x.total);
  const r = $('#rcRemain'); r.textContent = money(x.remain); r.className = 'v ' + (x.remain > 0 ? 'debt' : 'paid');
  $('#retList').innerHTML = D.returns.length
    ? D.returns.map((it, i) => `<div class="item"><div class="grow"><div class="nm">${esc(it.name)} × ${it.qty}</div></div><span class="num paid" style="font-weight:600">−${grp(it.value)} đ</span>${ro ? '' : `<button class="icon-btn" data-act="delReturn" data-i="${i}" aria-label="Xoá món">${icon('trash')}</button>`}</div>`).join('') + `<div class="item"><div class="grow sub">Trừ vào tổng phải thu</div><span class="num paid" style="font-weight:700">−${grp(x.ret)} đ</span>${ro ? '' : '<span style="width:40px"></span>'}</div>`

function vReturns() {

    + `<div class="card"><div class="tabs" role="tablist">${tabs}</div><div id="wBody"></div></div>
    <p class="sub" style="margin:0">Hàng quay đầu không làm thay đổi nợ của khách. Khi hãng nhận bảo hành, chuyến sau giao hàng đổi; khi hãng từ chối, trả lại món đó cho khách.</p>`;
}
function paintReturns() {
  const tab = UI.wTab; const T = todayISO();
  let list = S.warranty.filter(w => wTabOf(w) === tab);
  list.sort((a, b) => tab === 'done' ? (a.doneDate < b.doneDate ? 1 : -1) : (a.receivedDate < b.receivedDate ? -1 : 1));
  UI.wSel.forEach(id => { if (!list.some(w => w.id === id)) UI.wSel.delete(id); });
  const groups = new Map();
  list.forEach(w => { const k = w.brandId || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(w); });
  const rowHTML = w => {
    const c = custOf(w.customerId); const b = brandOf(w.brandId); const days = wDays(w);
    const late = (w.status === 'waiting' || w.status === 'sent') && days >= WARRANTY_LATE;
    const selectable = tab === 'waiting' && b && b.accepts;
    let acts = '';
    if (w.status === 'waiting') acts = b && b.accepts ? `<button class="btn sm" data-act="wDo" data-to="sent" data-id="${w.id}">Gửi hãng</button>` : `<button class="btn sm" data-act="wDo" data-to="rejected" data-id="${w.id}">Trả lại khách</button>`;
    if (w.status === 'sent') acts = `<button class="btn sm" data-act="wDo" data-to="accepted" data-id="${w.id}">${icon('check')}Hãng nhận</button><button class="btn sm danger" data-act="wDo" data-to="rejected" data-id="${w.id}">Hãng từ chối</button>`;
    if (w.status === 'accepted' || w.status === 'rejected') acts = `<button class="btn sm" data-act="wDo" data-to="done" data-id="${w.id}">${icon('check')}Đã giao cho khách</button>`;
    if (w.status !== 'waiting') acts += `<button class="icon-btn" data-act="wUndo" data-id="${w.id}" aria-label="Hoàn tác bước vừa rồi" title="Hoàn tác">${icon('undo')}</button>`;
    const stepTxt = { waiting: `nhận ${fmtDate(w.receivedDate)}`, sent: `gửi hãng ${fmtDate(w.sentDate)}`, accepted: `hãng nhận ${fmtDate(w.resolvedDate)} · cần giao hàng đổi`, rejected: `${w.sentDate ? 'hãng từ chối' : 'không gửi hãng'} ${fmtDate(w.resolvedDate)} · cần trả lại khách`, done: `${w.outcome === 'exchanged' ? 'đã giao hàng đổi' : 'đã trả lại khách'} ${fmtDate(w.doneDate)}` }[w.status];
    return `<div class="w-row"><span class="cb">${selectable ? `<input type="checkbox" data-wsel="${w.id}" ${UI.wSel.has(w.id) ? 'checked' : ''} aria-label="Chọn ${esc(w.name)}">` : ''}</span>
      <div class="w-n" style="min-width:0"><div class="nm">${esc(w.name)} × ${w.qty}</div><div class="sub">${w.defect ? esc(w.defect) + ' · ' : ''}${stepTxt}</div></div>
      <div class="w-k" style="min-width:0">${c ? `<a href="#cust/${c.id}" data-go="cust/${c.id}" style="font-weight:600;text-decoration:none">${esc(c.name)}</a> ${areaTag(c.areaId)}` : '?'}</div>
      <div class="w-v num">${w.value ? money(w.value) : '<span class="muted">—</span>'}</div>
      <div class="w-d">${chip(`${days} ngày`, w.status === 'done' || w.status === 'accepted' || w.status === 'rejected' ? '' : days >= 30 ? 'debt' : late ? 'wait' : '')}</div>
      <div class="acts">${acts}</div></div>`;
  };
  const sel = UI.wSel.size;
  $('#wBody').innerHTML = (tab === 'waiting' && list.some(w => (brandOf(w.brandId) || {}).accepts) ? `<div class="bulk"><span class="sub" style="color:var(--ink)">${sel ? `Đã chọn <b>${sel}</b> món` : 'Tick các món mang đi gửi hãng cùng lúc'}</span><button class="btn sm primary" data-act="wBulk" ${sel ? '' : 'disabled'}>${icon('truck')}Đánh dấu đã gửi hãng</button></div>` : '')
    + (list.length ? [...groups.entries()].map(([bid, ws]) => { const b = brandOf(bid); return `<div class="brand-h"><h3>${esc(b ? b.name : 'Chưa chọn hãng')}</h3>${b ? (b.accepts ? chip('Nhận quay đầu', 'paid') : chip('Không nhận quay đầu', 'debt')) : ''}<span class="sub">${ws.length} món</span></div>${ws.map(rowHTML).join('')}`; }).join('')
      : `<div class="empty">${{ waiting: 'Không có món nào chờ gửi hãng.', sent: 'Không có món nào đang ở hãng.', back: 'Không có món nào cần giao lại khách.', done: 'Chưa có món nào xử lý xong.' }[tab]}</div>`);
}

ACT.exportData = async () => {
  const name = `huu-thuy-so-cong-no-${todayISO()}.json`;
  const data = JSON.stringify(S, null, 1);
  let ok = false;
  if (HOSTED) {
    try {
      ok = await hostedSave(name, data);
      if (!ok) toast('Trang này không cho tải file. Mở file app trên máy để sao lưu.');
    } catch (e) { if (e && e.code !== 'declined') toast('Không tải được file sao lưu.'); }
  } else {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); ok = true;
    } catch (e) { toast('Không tải được file sao lưu.'); }
  }
  if (ok) { S.settings.lastBackup = todayISO(); save(); toast('Đã xuất file sao lưu'); render(); }
};
function importFile(file) {
  const rd = new FileReader();
  rd.onload = async () => {
    let d;
    try { d = JSON.parse(rd.result); } catch (e) { toast('File không đúng định dạng sao lưu.'); return; }
    if (!d || d.version !== 1 || !Array.isArray(d.customers) || !Array.isArray(d.entries)) { toast('File không phải bản sao lưu của sổ công nợ.'); return; }
    const ok = await confirmBox('Nhập file sao lưu?', `File có ${d.customers.length} khách, ${(d.trips || []).length} chuyến, ${d.entries.length} dòng sổ nợ. Dữ liệu hiện tại trên máy này sẽ bị thay thế.`, 'Nhập và thay thế', true);
    if (!ok) return;
    S = Object.assign(emptyState(), d); save(); toast('Đã nhập dữ liệu'); go('', { force: true });
  };
  rd.readAsText(file);
}
